version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.2
  shm_size: 512mb
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__HOSTNAME_CALLABLE=airflow.utils.net.get_host_ip_address
    - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8080
    - AIRFLOW__WEBSERVER__SECRET_KEY=nyc_taxi_airflow_secret_key_super_secure
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    - AIRFLOW__CORE__DAGRUN_TIMEOUT=7200
    - AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD=1800
    - AIRFLOW__CORE__KILLED_TASK_CLEANUP_TIME=1800
    - PYTHONPATH=/opt/airflow:/opt/airflow/src:/opt/airflow/settings
    - _PIP_ADDITIONAL_REQUIREMENTS=pyarrow pandas psycopg[binary] pydantic pydantic-settings psutil requests plotly
    # Target Application Database Parameters
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_NAME=${DB_NAME:-nyc_taxi}
    - DB_USER=${DB_USER:-postgres}
    - DB_PASSWORD=${DB_PASSWORD:-postgres}
    - APP_ENV=dev
    # Slack Alerting Configuration
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    - SLACK_CHANNEL=${SLACK_CHANNEL:-#data-pipeline-alerts}
    - SLACK_ALERTS_ENABLED=${SLACK_ALERTS_ENABLED:-true}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./settings:/opt/airflow/settings
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./requirements.txt:/opt/airflow/requirements.txt
  networks:
    - taxi_net

services:
  # ============================================================================
  # 1. PostgreSQL 17 Database Service (Hosts both 'nyc_taxi' and 'airflow' DBs)
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: nyc_taxi_postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${DB_NAME:-nyc_taxi}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_init_databases.sh:/docker-entrypoint-initdb.d/00_init_databases.sh:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/analytics_queries.sql:/docker-entrypoint-initdb.d/02_analytics_queries.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nyc_taxi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - taxi_net

  # ============================================================================
  # 1.5. pgAdmin 4 (PostgreSQL Web Dashboard & SQL Query Window)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:8.3
    container_name: nyc_taxi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi_net

  # ============================================================================
  # 1.8. Apache Superset BI & Analytics Dashboard (Task 5: Superset Dashboard)
  # ============================================================================
  superset-init:
    image: apache/superset:3.1.0
    container_name: nyc_taxi_superset_init
    user: "root"
    entrypoint: ["/etc/superset/init_superset.sh"]
    environment:
      - SUPERSET_SECRET_KEY=nyc_taxi_superset_secret_key_super_secure_12345
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/superset
      - SUPERSET_CONFIG_PATH=/etc/superset/superset_config.py
      - PYTHONPATH=/etc/superset
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
      - ./docker/superset:/etc/superset
    networks:
      - taxi_net

  superset:
    image: apache/superset:3.1.0
    container_name: nyc_taxi_superset
    restart: unless-stopped
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    environment:
      - SUPERSET_SECRET_KEY=nyc_taxi_superset_secret_key_super_secure_12345
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/superset
      - SUPERSET_CONFIG_PATH=/etc/superset/superset_config.py
      - PYTHONPATH=/etc/superset
      - SUPERSET_LOAD_EXAMPLES=no
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - superset_home:/app/superset_home
      - ./docker/superset:/etc/superset
    networks:
      - taxi_net

  # ============================================================================
  # 2. Apache Airflow Orchestration Services (Task 3: Modern Airflow in Docker)
  # ============================================================================
  airflow-init:
    <<: *airflow-common
    container_name: nyc_taxi_airflow_init
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - |
        set -e
        echo "1. Checking/creating 'airflow' database in PostgreSQL..."
        python -c "
        import os, psycopg2
        user = os.getenv('DB_USER', 'postgres')
        password = os.getenv('DB_PASSWORD', 'postgres')
        try:
            conn = psycopg2.connect(f'postgresql://{user}:{password}@postgres:5432/postgres')
            conn.autocommit = True
            with conn.cursor() as cur:
                cur.execute(\"SELECT 1 FROM pg_database WHERE datname='airflow'\")
                if not cur.fetchone():
                    cur.execute(\"CREATE DATABASE airflow;\")
                    print(\"Created 'airflow' metadata database.\")
                else:
                    print(\"'airflow' database already exists.\")
            conn.close()
        except Exception as e:
            print('Notice during DB check:', e)
        "

        echo "2. Running Airflow database migrations..."
        airflow db migrate

        echo "3. Creating or resetting admin credentials..."
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || \
        airflow users reset-password \
          --username admin \
          --password admin

        echo "Airflow initialization finished successfully!"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_taxi_airflow_webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_taxi_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================================================
  # 3. Forward Compatibility for Assignment 2 (Streaming & Advanced Monitoring)
  # Uncomment the blocks below when transitioning to Assignment 2
  # ============================================================================

  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
